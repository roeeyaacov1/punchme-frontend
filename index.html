<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately NOT the same file as src/assets/logo.png. That one is
         transparent line art, which a tab strip in dark mode would render
         invisible; the favicon keeps its opaque plate. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rubik carries the display voice and matches the logo's geometric
         wordmark; Assistant is the body face. Both ship Hebrew and Latin in
         one family, so the Hebrew site is set rather than falling back to an
         OS face. IBM Plex Mono is digits only — readouts, serials and the
         studio's own chrome — and it has no Hebrew. It sets nothing on the
         two wallet cards any more: those are the wallets' faces, not ours.

         Roboto is not ours at all. It is the face Google Wallet sets a pass
         in, and the Google card preview is a spec match rather than a
         design — without it an owner judges their card in Assistant and the
         phone shows them something else. Latin only by design: Roboto ships
         no Hebrew, and a Hebrew pass is set in the phone's own Hebrew face,
         which is exactly what falling through gives us.

         display=swap paints the page at once in faces the device has, and
         the files then land one by one. Rubik, Assistant and Plex Mono each
         fall back first to stand-ins sized to match them
         (src/font-fallbacks.css), so the lines break in the same places
         before and after and nothing below them moves. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@400;500&family=Rubik:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>PunchMe — Digital Loyalty Cards</title>

    <!-- ── Installable ────────────────────────────────────────────────────
         Chrome only offers an install if a manifest and a service worker
         with a fetch handler are both present; iOS reads the manifest too
         since 16.4, and from iOS 26 treats anything added to the Home
         Screen as a web app regardless. See src/pwa/. -->
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <!-- iOS composites this on black and rounds the corners itself, so it
         is opaque and full-bleed rather than transparent line art. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PunchMe" />
    <!--
      Deliberately NOT `apple-mobile-web-app-capable`. That meta is the only
      thing that forces standalone on iOS below 16.4, and standalone is
      exactly where WebKit's camera bugs live — the permission is not
      persisted between launches, which would make the scanner ask again
      every morning. Leaving it out lets those older iPhones open from the
      Home Screen in Safari, where the camera grant sticks; 16.4 and up read
      `display` from the manifest and are unaffected either way.
    -->
    <!-- The colour of the phone's status bar behind the app. The dashboard
         is a user choice, not just a system one, so useDashboardTheme
         overrides this with a meta of its own while it is mounted. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f23" />
    <script>
      // The manifest is a static file and cannot read i18next, so the
      // Hebrew build of it is swapped in here — the app's name is a brand
      // name either way, but the long-press shortcut is real copy.
      (function () {
        try {
          if ((localStorage.getItem("i18nextLng") || "").indexOf("he") === 0) {
            document
              .getElementById("app-manifest")
              .setAttribute("href", "/manifest.he.webmanifest");
          }
        } catch (e) {
          /* storage disabled — the English manifest is a fine default */
        }
      })();
    </script>
    <!-- The dashboard can be dark, and React cannot mount fast enough to stop
         a white page flashing first on a hard load. So the ground is decided
         here, before the first paint, from the same key and the same class
         names src/theme/useDashboardTheme.ts uses — keep the two in step.
         /billing counts as the dashboard, since it only forwards there (it
         is where Stripe's portal sends the owner back). The two pages
         Stripe's checkout returns to stand outside the shell, on Lightbox,
         at night when the dashboard is. The public pages and the wizard
         stand on Lightbox by day only, with the wall as the status bar's
         colour, which src/theme/usePublicGround.ts keeps once they mount (it
         reuses the meta marked data-public). Every other route is light and
         gets nothing.

         The dashboard also runs edge to edge on a phone (viewport-fit=cover),
         which useShellViewport sets while it is mounted and takes away when
         it goes. It is set here as well, so a cold launch from the home
         screen doesn't open letterboxed and then jump. -->
    <script>
      (function () {
        var shell = /^\/(dashboard(\/|$)|billing\/?$)/.test(location.pathname);
        var returned = /^\/billing\/(success|cancel)\/?$/.test(location.pathname);
        if (/^\/(login|onboarding(\/[^/]*)?|(invite|join|c|p)\/[^/]+)\/?$/.test(location.pathname)) {
          document.documentElement.classList.add("theme-lightbox");
          var wall = document.createElement("meta");
          wall.name = "theme-color";
          wall.content = "#f6f2eb";
          wall.setAttribute("data-public", "");
          document.head.insertBefore(wall, document.querySelector('meta[name="theme-color"]'));
          return;
        }
        if (!shell && !returned) return;
        var viewport = document.querySelector('meta[name="viewport"]');
        if (shell && viewport && viewport.content.indexOf("viewport-fit") === -1) {
          viewport.setAttribute("content", viewport.content + ", viewport-fit=cover");
        }
        var mode;
        try {
          mode = localStorage.getItem("punchme.theme");
        } catch (e) {
          /* storage disabled — follow the device */
        }
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (shell) root.classList.add("theme-purple", "theme-raised");
        else root.classList.add("theme-lightbox");
        if (dark) root.classList.add("theme-night");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
