<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately NOT the same file as src/assets/logo.png. That one is
         transparent line art, which a tab strip in dark mode would render
         invisible; the favicon keeps its opaque plate. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rubik carries the display voice and matches the logo's geometric
         wordmark; Assistant is the body face. Both ship Hebrew and Latin in
         one family, so the Hebrew site is set rather than falling back to an
         OS face. IBM Plex Mono is digits only — the pass field labels in the
         card studio use it, and it has no Hebrew. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=Rubik:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>PunchMe — Digital Loyalty Cards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
