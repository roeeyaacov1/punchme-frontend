<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately NOT the same file as src/assets/logo.png. That one is
         transparent line art, which a tab strip in dark mode would render
         invisible; the favicon keeps its opaque plate. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rubik carries the display voice and matches the logo's geometric
         wordmark; Assistant is the body face. Both ship Hebrew and Latin in
         one family, so the Hebrew site is set rather than falling back to an
         OS face. IBM Plex Mono is digits only — the pass field labels in the
         card studio use it, and it has no Hebrew. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400..700&family=IBM+Plex+Mono:wght@400;500&family=Rubik:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>PunchMe — Digital Loyalty Cards</title>
    <!-- The dashboard can be dark, and React cannot mount fast enough to stop
         a white page flashing first on a hard load. So the ground is decided
         here, before the first paint, from the same key and the same class
         names src/theme/useDashboardTheme.ts uses — keep the two in step.
         Every other route is light and gets nothing. -->
    <script>
      (function () {
        if (!/^\/dashboard(\/|$)/.test(location.pathname)) return;
        var mode;
        try {
          mode = localStorage.getItem("punchme.theme");
        } catch (e) {
          /* storage disabled — follow the device */
        }
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.add("theme-purple", "theme-raised");
        if (dark) root.classList.add("theme-night");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
